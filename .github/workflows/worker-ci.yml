name: Glutony Worker tests

on:
  push:
    paths:
      - 'worker.mjs'
      - 'test.mjs'
      - 'scheduled.test.mjs'
      - 'match-scan-gate.mjs'
      - 'rovalra-discovery.mjs'
      - 'rovalra-discovery.test.mjs'
      - 'hybrid-occupancy.mjs'
      - 'hybrid-occupancy.test.mjs'
      - 'shared-regions.test.mjs'
      - 'migrations/**'
      - 'package.json'
      - '.github/workflows/worker-ci.yml'
  pull_request:
    paths:
      - 'worker.mjs'
      - 'test.mjs'
      - 'scheduled.test.mjs'
      - 'match-scan-gate.mjs'
      - 'rovalra-discovery.mjs'
      - 'rovalra-discovery.test.mjs'
      - 'hybrid-occupancy.mjs'
      - 'hybrid-occupancy.test.mjs'
      - 'shared-regions.test.mjs'
      - 'migrations/**'
      - 'package.json'
      - '.github/workflows/worker-ci.yml'

permissions:
  contents: read

jobs:
  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker syntax
        run: node --check worker.mjs
      - name: Run Worker test suite
        run: npm test
